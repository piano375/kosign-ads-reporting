[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Requires the Netlify Next.js runtime/plugin. The dashboard is server-rendered
# because it fetches sanitized live Meta data from server-only code.
[[plugins]]
  package = "@netlify/plugin-nextjs"
